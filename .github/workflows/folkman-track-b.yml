name: Folkman Track B verification

on:
  push:
    branches: [formalize/folkman-track-b-class-interface-20261101]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: folkman-track-b-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Record exact source
        run: |
          mkdir -p verification-logs
          git rev-parse HEAD | tee verification-logs/source-sha.txt
          cat lean-toolchain | tee verification-logs/toolchain.txt
          git archive --format=tar.gz HEAD > verification-logs/source.tar.gz
      - name: Install pinned Lean toolchain
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          "$HOME/.elan/bin/elan" toolchain install "$(tr -d '\r\n' < lean-toolchain)"
      - name: Resolve pinned dependencies and Mathlib cache
        id: dependencies
        run: |
          set -euo pipefail
          lake update 2>&1 | tee verification-logs/dependencies.log
          lake exe cache get 2>&1 | tee verification-logs/mathlib-cache.log
      - name: Finite adversarial regressions
        run: |
          set -euo pipefail
          python3 scripts/check_folkman_track_b_strong_ap_small.py | tee verification-logs/strong-ap-regression.log
          python3 scripts/check_folkman_native_realisation_small.py | tee verification-logs/native-realisation-regression.log
          python3 scripts/check_folkman_native_heredity_small.py | tee verification-logs/heredity-regression.log
      - name: Build and inspect native hereditary closure
        id: heredity
        run: |
          set -euo pipefail
          lake build BANANA.NonPrecompact.FolkmanNativeFiniteHeredity 2>&1 | tee verification-logs/heredity-build.log
          lake env lean BANANA/NonPrecompact/FolkmanNativeFiniteHeredityAxiomAudit.lean 2>&1 | tee verification-logs/FolkmanNativeFiniteHeredity-axioms.log
      - name: Build other Track B modules explicitly
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        id: track_b
        run: |
          set -euo pipefail
          lake build \
            BANANA.NonPrecompact.FolkmanNativeFiniteAtomIndex \
            BANANA.NonPrecompact.FolkmanNativeFiniteIndexMorphisms \
            BANANA.NonPrecompact.FolkmanNativeFiniteCodeEmbedding \
            BANANA.NonPrecompact.FolkmanNativeFiniteClassInterface \
            BANANA.NonPrecompact.FolkmanNativeFiniteClassMorphismWitness \
            BANANA.NonPrecompact.FolkmanNativeFiniteClassCertificate \
            BANANA.NonPrecompact.FolkmanNativeFiniteCodeRealisation \
            2>&1 | tee verification-logs/track-b-build.log
      - name: Audit exact Track B transitive axioms
        if: ${{ !cancelled() && steps.track_b.outcome == 'success' }}
        run: |
          set -euo pipefail
          for name in FolkmanNativeFiniteAtomIndex FolkmanNativeFiniteIndexMorphisms FolkmanNativeFiniteCodeEmbedding FolkmanNativeFiniteClassInterface FolkmanNativeFiniteClassMorphismWitness FolkmanNativeFiniteCodeRealisation FolkmanNativeFiniteClassCertificate; do
            lake env lean "BANANA/NonPrecompact/${name}AxiomAudit.lean" 2>&1 | tee "verification-logs/${name}-axioms.log"
          done
      - name: Reject missing or non-standard proof axioms
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: |
          python3 - <<'PY'
          import pathlib
          import re
          import sys
          allowed = {'propext', 'Classical.choice', 'Quot.sound'}
          modules = ['FolkmanNativeFiniteHeredity', 'FolkmanNativeFiniteAtomIndex',
                     'FolkmanNativeFiniteIndexMorphisms', 'FolkmanNativeFiniteCodeEmbedding',
                     'FolkmanNativeFiniteClassInterface',
                     'FolkmanNativeFiniteClassMorphismWitness', 'FolkmanNativeFiniteCodeRealisation',
                     'FolkmanNativeFiniteClassCertificate']
          for module in modules:
              path = pathlib.Path('verification-logs') / f'{module}-axioms.log'
              if not path.is_file():
                  sys.exit(f'{path}: missing axiom audit')
              text = path.read_text()
              groups = re.findall(r'depends on axioms:\s*\[([^\]]*)\]', text, re.S)
              none = re.findall(r'does not depend on (?:any )?axioms', text)
              if not groups and not none:
                  sys.exit(f'{path}: no axiom audit results')
              unexpected = {x.strip() for g in groups for x in g.split(',') if x.strip()} - allowed
              if 'sorryAx' in text or unexpected:
                  sys.exit(f'{path}: unexpected axioms {unexpected}')
          print('All eight Track B axiom audits passed.')
          PY
      - name: Build existing integration root
        run: |
          set -euo pipefail
          lake build BANANA 2>&1 | tee verification-logs/root-build.log
          echo "Root build passed. Track B remains explicitly built above and is intentionally not added to BANANA.lean on this branch." | tee verification-logs/integration-note.log
      - name: Preserve verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: folkman-track-b-${{ github.sha }}
          path: verification-logs/
          if-no-files-found: error
          retention-days: 14
