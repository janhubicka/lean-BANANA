name: Publish BANANA wiki

on:
  gollum: # First Home-page creation or later Wiki edits trigger immediate sync.
  push:
    branches: [main]
    paths:
      - 'docs/wiki/**'
      - '.github/workflows/publish-wiki.yml'
  workflow_dispatch:

concurrency:
  group: publish-banana-wiki
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out documented revision
        uses: actions/checkout@v4

      # GitHub stores Wiki pages in a separate .wiki.git repository.
      # The repository must be initialized once via Wiki > Create the first
      # page before GitHub will expose that repository to git clone/push.
      # See docs/wiki/Publishing.md.
      - name: Check whether the Wiki Git repository exists
        id: wiki
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh auth setup-git
          if git ls-remote "https://github.com/${GITHUB_REPOSITORY}.wiki.git" HEAD >/dev/null 2>&1; then
            echo "initialized=true" >> "$GITHUB_OUTPUT"
          else
            echo "initialized=false" >> "$GITHUB_OUTPUT"
            echo "::notice::GitHub Wiki is not initialized. Create the first Home page at https://github.com/${GITHUB_REPOSITORY}/wiki and rerun this workflow."
          fi

      - name: Sync source documentation to the GitHub Wiki tab
        if: steps.wiki.outputs.initialized == 'true'
        uses: Andrew-Chen-Wang/github-wiki-action@v5
        with:
          path: docs/wiki
          preprocess: true
          strategy: clone
          disable-empty-commits: true

      - name: Verify published Wiki pages and attribution
        if: steps.wiki.outputs.initialized == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh auth setup-git
          git clone --depth=1 "https://github.com/${GITHUB_REPOSITORY}.wiki.git" "$RUNNER_TEMP/published-banana-wiki"
          cd "$RUNNER_TEMP/published-banana-wiki"
          for page in Home Formalised-statements Proof-architecture Mathematical-representations Verification-and-proof-boundaries Using-the-library AI-disclosure-and-licence Publishing _Sidebar; do
            test -s "$page.md"
            echo "Verified page: $page.md"
          done
          grep -Fq "OpenAI's ChatGPT" Home.md
          grep -Fq 'Apache-2.0' Home.md
          grep -Fq '387' Verification-and-proof-boundaries.md
          echo "Verified AI disclosure and licence in the published Home page."
          echo "Published Wiki revision: $(git rev-parse HEAD)"
