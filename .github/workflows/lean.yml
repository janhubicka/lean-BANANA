name: Publish mathematical formalisation guide to Wiki
on:
  push:
    branches: [publish-formalisation-wiki-20261126]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Publish guide without replacing existing Wiki material
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          # Use only the repository-scoped Actions token. Do not disclose credentials.
          wiki_url="https://github.com/janhubicka/lean-BANANA.wiki.git"
          wiki_dir="$RUNNER_TEMP/lean-banana-wiki"
          export GIT_TERMINAL_PROMPT=0
          git clone --depth=1 "$wiki_url" "$wiki_dir"
          cp docs/wiki-formalisation-guide.md "$wiki_dir/ArXiv-v1-formalisation.md"
          cd "$wiki_dir"
          # Preserve the existing Home page and every other existing Wiki page.
          if [ -f Home.md ]; then
            if ! grep -Fq '[[ArXiv-v1-formalisation]]' Home.md; then
              { printf '**Start here: [[ArXiv-v1-formalisation]]** — the mathematical representations, verified results and reproduction instructions for the first arXiv version.\n\n'; cat Home.md; } > Home.md.new
              mv Home.md.new Home.md
            fi
          else
            cp ArXiv-v1-formalisation.md Home.md
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Home.md ArXiv-v1-formalisation.md
          if git diff --cached --quiet; then
            echo 'Wiki already up to date.'
            exit 0
          fi
          git commit -m 'Explain the Lean formalisation for arXiv v1'
          # Use the normal GitHub authentication header for this repository only.
          # Mask the encoded token as well as the original token.
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          echo "::add-mask::$auth"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" push origin HEAD
          git fetch origin
          test "$(git rev-parse HEAD)" = "$(git rev-parse '@{upstream}')"
          echo "Published Wiki revision $(git rev-parse HEAD)"
