name: Temporary verified Lean source archive transfer
on:
  push:
    branches: [arxiv-v1-source-transfer-20261126]
permissions:
  contents: read
jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 4fabdd7cf1bf1206912cd0d6c92e685b04e769cf
          fetch-depth: 1
      - name: Archive the exact verified source (no Lean build)
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 4fabdd7cf1bf1206912cd0d6c92e685b04e769cf
          test "$(git rev-parse 'HEAD^{tree}')" = c4abf542fe7d09006f035694cda5f14f82ecd088
          mkdir -p "${RUNNER_TEMP}/banana-transfer"
          out="${RUNNER_TEMP}/banana-transfer"
          git archive --format=tar.gz --prefix=lean-banana/ -o "$out/lean-banana-arxiv-v1-candidate-4fabdd7cf1.tar.gz" HEAD
          git rev-parse HEAD 'HEAD^{tree}' > "$out/source-revision.txt"
          (cd "$out"; sha256sum lean-banana-arxiv-v1-candidate-4fabdd7cf1.tar.gz source-revision.txt > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: lean-banana-source-4fabdd7cf1
          path: ${{ runner.temp }}/banana-transfer/
          if-no-files-found: error
