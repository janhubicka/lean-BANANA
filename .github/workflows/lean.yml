          lake build BANANA.NonPrecompact.PrebananaFiveAryWordPrefixAxiomAudit
          lake env lean BANANA/NonPrecompact/PrebananaFiveAryWordPrefixAxiomAudit.lean

      - name: Audit abstract marked finite stage embeddings to word atom partitions
        run: |
          lake build BANANA.NonPrecompact.PrebananaFiniteStageAtomPartitionAxiomAudit
          lake env lean BANANA/NonPrecompact/PrebananaFiniteStageAtomPartitionAxiomAudit.lean

      - name: Audit finite powerset atoms versus literal five-ary word atoms
