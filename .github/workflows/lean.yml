name: Lean

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache Lean toolchain
        uses: actions/cache@v5
        with:
          path: ~/.elan/toolchains
          key: lean-toolchain-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain') }}

      - name: Cache Lake workspace
        uses: actions/cache@v5
        with:
          path: .lake
          key: lake-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lakefile.toml') }}-${{ github.sha }}
          restore-keys: |
            lake-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lakefile.toml') }}-

      - name: Install elan
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Resolve dependencies
        run: lake update

      - name: Download Mathlib cache
        run: lake exe cache get

      - name: Build
        run: lake build

      - name: Check redundant triple-coordinate maps
        run: |
          lake build BANANA.NonPrecompact.BananaTripleCoordinatesAxiomAudit
          lake env lean BANANA/NonPrecompact/BananaTripleCoordinatesAxiomAudit.lean

      - name: Check injective strong images in redundant coordinates
        run: |
          lake build BANANA.NonPrecompact.BananaTripleStrongImagesAxiomAudit
          lake env lean BANANA/NonPrecompact/BananaTripleStrongImagesAxiomAudit.lean

      - name: Check exact intersection of arbitrary strong images
        run: |
          lake build BANANA.NonPrecompact.BananaTripleIntersectionAxiomAudit
          lake env lean BANANA/NonPrecompact/BananaTripleIntersectionAxiomAudit.lean

      - name: Check complete arbitrary BANANA strong amalgamation
        run: |
          lake build BANANA.NonPrecompact.BananaTriplePairingAxiomAudit
          lake env lean BANANA/NonPrecompact/BananaTriplePairingAxiomAudit.lean

      - name: Regression on arbitrary strong amalgamation diagrams
        run: python3 scripts/check_strong_amalgam_arbitrary_small.py

      - name: Check perfect pairing of finite BANANA limit blocks
        run: |
          lake build BANANA.NonPrecompact.BananaPerfectFiniteBlocksAxiomAudit
          lake env lean BANANA/NonPrecompact/BananaPerfectFiniteBlocksAxiomAudit.lean

      - name: Check standard perfect pairings inside the rational limit
        run: |
          lake build BANANA.NonPrecompact.BananaLimitPerfectEmbeddingAxiomAudit
          lake env lean BANANA/NonPrecompact/BananaLimitPerfectEmbeddingAxiomAudit.lean

      - name: Check embedding of every finite BANANA pairing into the limit
        run: |
          lake build BANANA.NonPrecompact.BananaLimitUniversalityAxiomAudit
          lake env lean BANANA/NonPrecompact/BananaLimitUniversalityAxiomAudit.lean

      - name: Check algebraic local finiteness of the BANANA limit
        run: |
          lake build BANANA.NonPrecompact.BananaLimitLocalFinitenessAxiomAudit
          lake env lean BANANA/NonPrecompact/BananaLimitLocalFinitenessAxiomAudit.lean

      - name: Check BANANA limit orthogonality of disjoint blocks
        run: |
          lake build BANANA.NonPrecompact.BananaLimitOrthogonalityAxiomAudit
          lake env lean BANANA/NonPrecompact/BananaLimitOrthogonalityAxiomAudit.lean

      - name: Check finite coordinate blocks of the BANANA limit
        run: |
          lake build BANANA.NonPrecompact.BananaFiniteSupportBlocksAxiomAudit
          lake env lean BANANA/NonPrecompact/BananaFiniteSupportBlocksAxiomAudit.lean

      - name: Regress finite BANANA tuple signatures against GL orbits
        run: python3 scripts/check_omega_tuple_signature_small.py

      - name: Check BANANA tuple kernel and range equivalences
        run: |
          lake build BANANA.NonPrecompact.BananaLimitTupleKernelRangeAxiomAudit
          lake env lean BANANA/NonPrecompact/BananaLimitTupleKernelRangeAxiomAudit.lean

      - name: Check finite representatives from a complete invariant
        run: |
          lake build BANANA.NonPrecompact.FiniteInvariantRepresentativesAxiomAudit
          lake env lean BANANA/NonPrecompact/FiniteInvariantRepresentativesAxiomAudit.lean

      - name: Check finite tuple signature foundations for BANANA orbit types
        run: |
          lake build BANANA.NonPrecompact.BananaLimitTupleSignaturesAxiomAudit
          lake env lean BANANA/NonPrecompact/BananaLimitTupleSignaturesAxiomAudit.lean

      - name: Check intrinsic finite-subspace homogeneity of BANANA limit
        run: |
          lake build BANANA.NonPrecompact.BananaLimitSubspaceHomogeneityAxiomAudit
          lake env lean BANANA/NonPrecompact/BananaLimitSubspaceHomogeneityAxiomAudit.lean

      - name: Check global homogeneity of explicit BANANA limit
        run: |
          lake build BANANA.NonPrecompact.BananaLimitGlobalHomogeneityAxiomAudit
          lake env lean BANANA/NonPrecompact/BananaLimitGlobalHomogeneityAxiomAudit.lean

      - name: Check finite perfect ambient automorphism for two limit embeddings
        run: |
          lake build BANANA.NonPrecompact.BananaLimitFinitePairHomogeneityAxiomAudit
          lake env lean BANANA/NonPrecompact/BananaLimitFinitePairHomogeneityAxiomAudit.lean

      - name: Check finite embedding factorisation into BANANA limit blocks
        run: |
          lake build BANANA.NonPrecompact.BananaLimitFiniteEmbeddingFactorAxiomAudit
          lake env lean BANANA/NonPrecompact/BananaLimitFiniteEmbeddingFactorAxiomAudit.lean

      - name: Check finite age of explicit BANANA limit
        run: |
          lake build BANANA.NonPrecompact.BananaLimitFiniteAgeAxiomAudit
          lake env lean BANANA/NonPrecompact/BananaLimitFiniteAgeAxiomAudit.lean

      - name: Check cofinal perfect blocks in explicit BANANA limit
        run: |
          lake build BANANA.NonPrecompact.BananaLimitBlockCofinalityAxiomAudit
          lake env lean BANANA/NonPrecompact/BananaLimitBlockCofinalityAxiomAudit.lean

      - name: Check projection to finite BANANA limit blocks
        run: |
          lake build BANANA.NonPrecompact.BananaLimitBlockProjectionAxiomAudit
          lake env lean BANANA/NonPrecompact/BananaLimitBlockProjectionAxiomAudit.lean

      - name: Check finite tuple orbits of explicit BANANA limit
        run: |
          lake build BANANA.NonPrecompact.BananaLimitFiniteOrbitsAxiomAudit
          lake env lean BANANA/NonPrecompact/BananaLimitFiniteOrbitsAxiomAudit.lean

      - name: Check tuple orbit signature completeness
        run: |
          lake build BANANA.NonPrecompact.BananaLimitTupleOrbitAxiomAudit
          lake env lean BANANA/NonPrecompact/BananaLimitTupleOrbitAxiomAudit.lean

      - name: Check pairings of all finite BANANA tuple combinations
        run: |
          lake build BANANA.NonPrecompact.BananaLimitTuplePairingAxiomAudit
          lake env lean BANANA/NonPrecompact/BananaLimitTuplePairingAxiomAudit.lean

      - name: Check scalar bilinearity of explicit BANANA limit
        run: |
          lake build BANANA.NonPrecompact.BananaLimitBilinearityAxiomAudit
          lake env lean BANANA/NonPrecompact/BananaLimitBilinearityAxiomAudit.lean

      - name: Check explicit countable BANANA limit pairing
        run: |
          lake build BANANA.NonPrecompact.BananaExplicitLimitAxiomAudit
          lake env lean BANANA/NonPrecompact/BananaExplicitLimitAxiomAudit.lean

      - name: Check finite BANANA countability and unbounded dimensions
        run: |
          lake build BANANA.NonPrecompact.BananaFiniteCountabilityAxiomAudit
          lake env lean BANANA/NonPrecompact/BananaFiniteCountabilityAxiomAudit.lean

      - name: Check global lifts of finite BANANA block pairing automorphisms
        run: |
          lake build BANANA.NonPrecompact.BananaLimitBlockPairLiftAxiomAudit
          lake env lean BANANA/NonPrecompact/BananaLimitBlockPairLiftAxiomAudit.lean

      - name: Exhaustive small-model regression of finite-block pairing lifts
        run: python3 scripts/check_finite_block_pair_lift_small.py

      - name: Check lifting automorphisms of finite BANANA blocks
        run: |
          lake build BANANA.NonPrecompact.BananaRetractionLiftEquivAxiomAudit
          lake env lean BANANA/NonPrecompact/BananaRetractionLiftEquivAxiomAudit.lean

      - name: Check finite hereditary and joint embedding properties
        run: |
          lake build BANANA.NonPrecompact.BananaFiniteFraissePropertiesAxiomAudit
          lake env lean BANANA/NonPrecompact/BananaFiniteFraissePropertiesAxiomAudit.lean

      - name: Check arbitrary strong-amalgamation transport tools
        run: |
          lake build BANANA.NonPrecompact.BananaArbitraryAmalgamToolsAxiomAudit
          lake env lean BANANA/NonPrecompact/BananaArbitraryAmalgamToolsAxiomAudit.lean

      - name: Check pointwise finite-GL approximation of BANANA automorphisms
        run: |
          lake build BANANA.NonPrecompact.BananaLimitFiniteGLDensityAxiomAudit
          lake env lean BANANA/NonPrecompact/BananaLimitFiniteGLDensityAxiomAudit.lean

      - name: Check finite GL approximants of embedded BANANA structures
        run: |
          lake build BANANA.NonPrecompact.BananaLimitFiniteGLApproximationAxiomAudit
          lake env lean BANANA/NonPrecompact/BananaLimitFiniteGLApproximationAxiomAudit.lean

      - name: Regress nested finite BANANA GL actions in four coordinates
        run: python3 scripts/check_nested_banana_gl_small.py

      - name: Check finite GL stages as finite subgroup families
        run: |
          lake build BANANA.NonPrecompact.BananaLimitFiniteGLStagesAxiomAudit
          lake env lean BANANA/NonPrecompact/BananaLimitFiniteGLStagesAxiomAudit.lean

      - name: Check fixed outside components of nested BANANA blocks
        run: |
          lake build BANANA.NonPrecompact.BananaLimitOutsideLargerBlockAxiomAudit
          lake env lean BANANA/NonPrecompact/BananaLimitOutsideLargerBlockAxiomAudit.lean

      - name: Check intertwining actions on split perfect BANANA systems
        run: |
          lake build BANANA.NonPrecompact.BananaPerfectSplitSystemActionsAxiomAudit
          lake env lean BANANA/NonPrecompact/BananaPerfectSplitSystemActionsAxiomAudit.lean

      - name: Check orthogonal decompositions around perfect BANANA subpairs
        run: |
          lake build BANANA.NonPrecompact.BananaPerfectOrthogonalDecompositionAxiomAudit
          lake env lean BANANA/NonPrecompact/BananaPerfectOrthogonalDecompositionAxiomAudit.lean

      - name: Check simultaneous actions on three perfect BANANA blocks
        run: |
          lake build BANANA.NonPrecompact.BananaPerfectTripleAutomorphismsAxiomAudit
          lake env lean BANANA/NonPrecompact/BananaPerfectTripleAutomorphismsAxiomAudit.lean

      - name: Check finite GL global action identity and composition
        run: |
          lake build BANANA.NonPrecompact.BananaLimitFiniteGLGroupActionAxiomAudit
          lake env lean BANANA/NonPrecompact/BananaLimitFiniteGLGroupActionAxiomAudit.lean

      - name: Check pointwise approximation by the locally finite GL union
        run: |
          lake build BANANA.NonPrecompact.BananaLimitLocallyFiniteDenseAxiomAudit
          lake env lean BANANA/NonPrecompact/BananaLimitLocallyFiniteDenseAxiomAudit.lean

      - name: Check directed locally finite GL automorphism union
        run: |
          lake build BANANA.NonPrecompact.BananaLimitDirectedGLUnionAxiomAudit
          lake env lean BANANA/NonPrecompact/BananaLimitDirectedGLUnionAxiomAudit.lean

      - name: Check nested finite GL group stages are compatible
        run: |
          lake build BANANA.NonPrecompact.BananaLimitFiniteGLStageInclusionsAxiomAudit
          lake env lean BANANA/NonPrecompact/BananaLimitFiniteGLStageInclusionsAxiomAudit.lean

      - name: Check smaller-block lifts equal extended larger restrictions
        run: |
          lake build BANANA.NonPrecompact.BananaLimitBlockExtendRestrictionAxiomAudit
          lake env lean BANANA/NonPrecompact/BananaLimitBlockExtendRestrictionAxiomAudit.lean

      - name: Check larger-block restriction of finite GL lifts
        run: |
          lake build BANANA.NonPrecompact.BananaLimitBlockRestrictionAxiomAudit
          lake env lean BANANA/NonPrecompact/BananaLimitBlockRestrictionAxiomAudit.lean

      - name: Check nested support preservation of finite block lifts
        run: |
          lake build BANANA.NonPrecompact.BananaLimitBlockSupportMonotonicityAxiomAudit
          lake env lean BANANA/NonPrecompact/BananaLimitBlockSupportMonotonicityAxiomAudit.lean

      - name: Check finite-block lift identity and composition
        run: |
          lake build BANANA.NonPrecompact.BananaLimitBlockLiftGroupLawAxiomAudit
          lake env lean BANANA/NonPrecompact/BananaLimitBlockLiftGroupLawAxiomAudit.lean

      - name: Check finite perfect-block GL actions on the BANANA limit
        run: |
          lake build BANANA.NonPrecompact.BananaLimitFiniteGLActionAxiomAudit
          lake env lean BANANA/NonPrecompact/BananaLimitFiniteGLActionAxiomAudit.lean

      - name: Check finite perfect-pair GL stages for coherent EPPA
        run: |
          lake build BANANA.NonPrecompact.FinitePerfectGLAxiomAudit
          lake env lean BANANA/NonPrecompact/FinitePerfectGLAxiomAudit.lean

      - name: Check staged copy Ramsey theorems and axioms
        run: bash scripts/check_staged_ramsey_degrees.sh

      - name: Check strong BANANA block amalgamation
        run: |
          lake build BANANA.NonPrecompact.BananaStrongBlockAmalgamAxiomAudit
          lake env lean BANANA/NonPrecompact/BananaStrongBlockAmalgamAxiomAudit.lean
