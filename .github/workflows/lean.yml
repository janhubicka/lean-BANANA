name: Lean

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache Lean toolchain
        uses: actions/cache@v5
        with:
          path: ~/.elan/toolchains
          key: lean-toolchain-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain') }}

      - name: Cache Lake workspace
        uses: actions/cache@v5
        with:
          path: .lake
          key: lake-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lakefile.toml') }}-${{ github.sha }}
          restore-keys: |
            lake-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lakefile.toml') }}-

      - name: Install elan
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Resolve dependencies
        run: lake update

      - name: Download Mathlib cache
        run: lake exe cache get

      - name: Build
        run: lake build

      - name: Check abstract finite Boolean embedding conjugation
        run: |
          lake build BANANA.NonPrecompact.PrebananaAbstractBooleanEmbeddingMapAxiomAudit
          lake env lean BANANA/NonPrecompact/PrebananaAbstractBooleanEmbeddingMapAxiomAudit.lean

      - name: Check surjective atom partitions of finite powerset embeddings
        run: |
          lake build BANANA.NonPrecompact.PrebananaPowersetMapPartitionsAxiomAudit
          lake env lean BANANA/NonPrecompact/PrebananaPowersetMapPartitionsAxiomAudit.lean

      - name: Check actual Boolean atom parity representation
        run: |
          lake build BANANA.NonPrecompact.PrebananaAbstractAtomsLiteralAxiomAudit
          lake env lean BANANA/NonPrecompact/PrebananaAbstractAtomsLiteralAxiomAudit.lean

      - name: Check marked parity of powerset atom fibres
        run: |
          lake build BANANA.NonPrecompact.PrebananaMarkedPowersetFibreAxiomAudit
          lake env lean BANANA/NonPrecompact/PrebananaMarkedPowersetFibreAxiomAudit.lean

      - name: Check arbitrary finite Boolean parity atom code
        run: |
          lake build BANANA.NonPrecompact.PrebananaAbstractAtomCodesAxiomAudit
          lake env lean BANANA/NonPrecompact/PrebananaAbstractAtomCodesAxiomAudit.lean

      - name: Check arbitrary marked finite Boolean atom partitions
        run: |
          lake build BANANA.NonPrecompact.PrebananaAbstractMarkedPartitionsAxiomAudit
          lake env lean BANANA/NonPrecompact/PrebananaAbstractMarkedPartitionsAxiomAudit.lean

      - name: Check parity of arbitrary finite Boolean element codes
        run: |
          lake build BANANA.NonPrecompact.PrebananaAbstractCodeParityAxiomAudit
          lake env lean BANANA/NonPrecompact/PrebananaAbstractCodeParityAxiomAudit.lean

      - name: Check Fin-indexed marked atom-partition transport
        run: |
          lake build BANANA.NonPrecompact.PrebananaReindexPartitionAxiomAudit
          lake env lean BANANA/NonPrecompact/PrebananaReindexPartitionAxiomAudit.lean

      - name: Check bijective abstract Boolean element code
        run: |
          lake build BANANA.NonPrecompact.PrebananaAbstractCodeEquivalenceAxiomAudit
          lake env lean BANANA/NonPrecompact/PrebananaAbstractCodeEquivalenceAxiomAudit.lean

      - name: Check strong intersection transfer to abstract carriers
        run: |
          lake build BANANA.NonPrecompact.PrebananaAbstractStrongIntersectionTransferAxiomAudit
          lake env lean BANANA/NonPrecompact/PrebananaAbstractStrongIntersectionTransferAxiomAudit.lean

      - name: Check marked Boolean code embedding properties
        run: |
          lake build BANANA.NonPrecompact.PrebananaCodedBooleanEmbeddingAxiomAudit
          lake env lean BANANA/NonPrecompact/PrebananaCodedBooleanEmbeddingAxiomAudit.lean

      - name: Check abstract-to-Fin marked Boolean embeddings
        run: |
          lake build BANANA.NonPrecompact.PrebananaAbstractEncodedEmbeddingsAxiomAudit
          lake env lean BANANA/NonPrecompact/PrebananaAbstractEncodedEmbeddingsAxiomAudit.lean

