name: Lean

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache Lean toolchain
        uses: actions/cache@v5
        with:
          path: ~/.elan/toolchains
          key: lean-toolchain-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain') }}

      - name: Cache Lake workspace
        uses: actions/cache@v5
        with:
          path: .lake
          key: lake-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lakefile.toml') }}-${{ github.sha }}
          restore-keys: |
            lake-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lakefile.toml') }}-

      - name: Install elan
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Resolve dependencies
        run: lake update

      - name: Download Mathlib cache
        run: lake exe cache get

      - name: Audit three-atom pre-BANANA partial isomorphism
        run: |
          lake build BANANA.NonPrecompact.PrebananaThreeAtomPartialIsomorphismAxiomAudit
          lake env lean BANANA/NonPrecompact/PrebananaThreeAtomPartialIsomorphismAxiomAudit.lean

      - name: Audit finite Boolean EPPA non-extension
        run: |
          lake build BANANA.NonPrecompact.PrebananaThreeAtomEppaExtensionAxiomAudit
          lake env lean BANANA/NonPrecompact/PrebananaThreeAtomEppaExtensionAxiomAudit.lean

      - name: Audit three-atom embedding mass obstruction
        run: |
          lake build BANANA.NonPrecompact.PrebananaAmenabilityThreeAtomCopyAxiomAudit
          lake env lean BANANA/NonPrecompact/PrebananaAmenabilityThreeAtomCopyAxiomAudit.lean

      - name: Audit probability-to-Boolean mass transfer
        run: |
          lake build BANANA.NonPrecompact.PrebananaStoneMeasureMassAxiomAudit
          lake env lean BANANA/NonPrecompact/PrebananaStoneMeasureMassAxiomAudit.lean

      - name: Audit atom-class pre-BANANA EPPA failure
        run: |
          lake build BANANA.NonPrecompact.PrebananaClassEPPAAxiomAudit
          lake env lean BANANA/NonPrecompact/PrebananaClassEPPAAxiomAudit.lean

      - name: Audit one-generator Boolean local finiteness
        run: |
          lake build BANANA.NonPrecompact.PrebananaOneGeneratorFourValuesAxiomAudit
          lake env lean BANANA/NonPrecompact/PrebananaOneGeneratorFourValuesAxiomAudit.lean

      - name: Audit unary Boolean truth-table normalisation
        run: |
          lake build BANANA.NonPrecompact.PrebananaUnaryTermTruthTableAxiomAudit
          lake env lean BANANA/NonPrecompact/PrebananaUnaryTermTruthTableAxiomAudit.lean

      - name: Audit unary Boolean equality kernels
        run: |
          lake build BANANA.NonPrecompact.PrebananaUnaryKernelTransferAxiomAudit
          lake env lean BANANA/NonPrecompact/PrebananaUnaryKernelTransferAxiomAudit.lean

      - name: Audit marked one-generator orbit transfer
        run: |
          lake build BANANA.NonPrecompact.PrebananaOneGeneratorMarkedIsoAxiomAudit
          lake env lean BANANA/NonPrecompact/PrebananaOneGeneratorMarkedIsoAxiomAudit.lean

      - name: Audit homogeneity-to-invariant-mass contradiction
        run: |
          lake build BANANA.NonPrecompact.PrebananaHomogeneousLimitMassObstructionAxiomAudit
          lake env lean BANANA/NonPrecompact/PrebananaHomogeneousLimitMassObstructionAxiomAudit.lean

      - name: Audit abstract finite Boolean class EPPA failure
        run: |
          lake build BANANA.NonPrecompact.PrebananaAbstractClassEPPAAxiomAudit
          lake env lean BANANA/NonPrecompact/PrebananaAbstractClassEPPAAxiomAudit.lean

      - name: Audit finite Boolean model strong amalgamation
        run: |
          lake build BANANA.NonPrecompact.PrebananaFiniteBooleanModelStrongAPAxiomAudit
          lake env lean BANANA/NonPrecompact/PrebananaFiniteBooleanModelStrongAPAxiomAudit.lean

      - name: Audit finite Boolean model joint embedding
        run: |
          lake build BANANA.NonPrecompact.PrebananaFiniteBooleanModelJEPAxiomAudit
          lake env lean BANANA/NonPrecompact/PrebananaFiniteBooleanModelJEPAxiomAudit.lean

      - name: Audit canonical finite Boolean atom presentation
        run: |
          lake build BANANA.NonPrecompact.PrebananaFiniteBooleanModelSkeletonAxiomAudit
          lake env lean BANANA/NonPrecompact/PrebananaFiniteBooleanModelSkeletonAxiomAudit.lean

      - name: Audit finite Boolean subalgebra heredity
        run: |
          lake build BANANA.NonPrecompact.PrebananaFiniteBooleanModelHeredityAxiomAudit
          lake env lean BANANA/NonPrecompact/PrebananaFiniteBooleanModelHeredityAxiomAudit.lean

      - name: Audit finite Boolean embedding identity and composition
        run: |
          lake build BANANA.NonPrecompact.PrebananaFiniteBooleanModelEmbeddingCalculusAxiomAudit
          lake env lean BANANA/NonPrecompact/PrebananaFiniteBooleanModelEmbeddingCalculusAxiomAudit.lean

      - name: Audit finite marked Boolean tower iteration
        run: |
          lake build BANANA.NonPrecompact.PrebananaFiniteBooleanTowerAxiomAudit
          lake env lean BANANA/NonPrecompact/PrebananaFiniteBooleanTowerAxiomAudit.lean

      - name: Audit five-ary child marking
        run: |
          lake build BANANA.NonPrecompact.PrebananaFiveAryChildMarkingAxiomAudit
          lake env lean BANANA/NonPrecompact/PrebananaFiveAryChildMarkingAxiomAudit.lean

      - name: Audit actual five-ary word marking
        run: |
          lake build BANANA.NonPrecompact.PrebananaFiveAryWordMarkAxiomAudit
          lake env lean BANANA/NonPrecompact/PrebananaFiveAryWordMarkAxiomAudit.lean

      - name: Audit all five-ary finite word stages
        run: |
          lake build BANANA.NonPrecompact.PrebananaFiveAryWordStageAxiomAudit
          lake env lean BANANA/NonPrecompact/PrebananaFiveAryWordStageAxiomAudit.lean

      - name: Audit residual parity for finite marked-atom allocation
        run: |
          lake build BANANA.NonPrecompact.PrebananaResidualParityAxiomAudit
          lake env lean BANANA/NonPrecompact/PrebananaResidualParityAxiomAudit.lean

      - name: Audit shared total and partial finite-owner sum identities
        run: |
          lake build BANANA.NonPrecompact.FiniteOwnerSumsAxiomAudit
          lake env lean BANANA/NonPrecompact/FiniteOwnerSumsAxiomAudit.lean

      - name: Audit atom witness allocation and surjectivity
        run: |
          lake build BANANA.NonPrecompact.PrebananaWitnessAllocationAxiomAudit
          lake env lean BANANA/NonPrecompact/PrebananaWitnessAllocationAxiomAudit.lean

      - name: Audit non-base witness fibre marking
        run: |
          lake build BANANA.NonPrecompact.PrebananaMarkedNonbaseFibresAxiomAudit
          lake env lean BANANA/NonPrecompact/PrebananaMarkedNonbaseFibresAxiomAudit.lean

      - name: Audit full witness allocation parity
        run: |
          lake build BANANA.NonPrecompact.PrebananaMarkedAllocationAxiomAudit
          lake env lean BANANA/NonPrecompact/PrebananaMarkedAllocationAxiomAudit.lean

      - name: Audit arbitrary-parent five-ary descendant parity
        run: |
          lake build BANANA.NonPrecompact.PrebananaFiveAryDescendantParityAxiomAudit
          lake env lean BANANA/NonPrecompact/PrebananaFiveAryDescendantParityAxiomAudit.lean

      - name: Audit explicit unmarked and marked suffix witnesses
        run: |
          lake build BANANA.NonPrecompact.PrebananaSingleSpecialSuffixAxiomAudit
          lake env lean BANANA/NonPrecompact/PrebananaSingleSpecialSuffixAxiomAudit.lean

      - name: Audit uniform suffix selection
        run: |
          lake build BANANA.NonPrecompact.PrebananaUniformSuffixSelectionAxiomAudit
          lake env lean BANANA/NonPrecompact/PrebananaUniformSuffixSelectionAxiomAudit.lean

      - name: Audit arbitrary finite target suffixes
        run: |
          lake build BANANA.NonPrecompact.PrebananaArbitraryTargetSuffixesAxiomAudit
          lake env lean BANANA/NonPrecompact/PrebananaArbitraryTargetSuffixesAxiomAudit.lean

      - name: Audit finite multi-parent marked allocation
        run: |
          lake build BANANA.NonPrecompact.PrebananaParentFibreMarkedAllocationAxiomAudit
          lake env lean BANANA/NonPrecompact/PrebananaParentFibreMarkedAllocationAxiomAudit.lean

      - name: Exhaustive base-compatible finite-allocation regression
        run: python3 scripts/check_prebanana_fibrewise_allocation_small.py

      - name: Audit prebanana fibrewise allocation
        run: |
          lake build BANANA.NonPrecompact.PrebananaFibrewiseAllocationAxiomAudit
          lake env lean BANANA/NonPrecompact/PrebananaFibrewiseAllocationAxiomAudit.lean

      - name: Audit prebanana fibrewise nonbase mark
        run: |
          lake build BANANA.NonPrecompact.PrebananaFibrewiseNonbaseMarkAxiomAudit
          lake env lean BANANA/NonPrecompact/PrebananaFibrewiseNonbaseMarkAxiomAudit.lean

      - name: Audit prebanana fibrewise sum
        run: |
          lake build BANANA.NonPrecompact.PrebananaFibrewiseSumAxiomAudit
          lake env lean BANANA/NonPrecompact/PrebananaFibrewiseSumAxiomAudit.lean

      - name: Audit prebanana base mark completion
        run: |
          lake build BANANA.NonPrecompact.PrebananaBaseMarkCompletionAxiomAudit
          lake env lean BANANA/NonPrecompact/PrebananaBaseMarkCompletionAxiomAudit.lean

      - name: Audit prebanana fibrewise marked allocation
        run: |
          lake build BANANA.NonPrecompact.PrebananaFibrewiseMarkedAllocationAxiomAudit
          lake env lean BANANA/NonPrecompact/PrebananaFibrewiseMarkedAllocationAxiomAudit.lean

      - name: Audit simultaneous marked refinement over finite base
        run: |
          lake build BANANA.NonPrecompact.PrebananaFiveAryRefinementAllocationAxiomAudit
          lake env lean BANANA/NonPrecompact/PrebananaFiveAryRefinementAllocationAxiomAudit.lean

      - name: Audit long-prefix representation of iterated marked tower embedding
        run: |
          lake build BANANA.NonPrecompact.PrebananaFiveAryTowerLongPrefixAxiomAudit
          lake env lean BANANA/NonPrecompact/PrebananaFiveAryTowerLongPrefixAxiomAudit.lean

      - name: Audit all-map compatibility of finite marked atom partitions
        run: |
          lake build BANANA.NonPrecompact.PrebananaFiniteStageAtomPartitionAxiomAudit
          lake env lean BANANA/NonPrecompact/PrebananaFiniteStageAtomPartitionAxiomAudit.lean

      - name: Audit unconditional arbitrary pre-BANANA finite extension
        run: |
          lake build BANANA.NonPrecompact.PrebananaFiveAryFiniteExtensionTheoremAxiomAudit
          lake env lean BANANA/NonPrecompact/PrebananaFiveAryFiniteExtensionTheoremAxiomAudit.lean

      - name: Audit abstract finite extension from compatible atom partitions
        run: |
          lake build BANANA.NonPrecompact.PrebananaFiveAryAbstractExtensionFromPartitionsAxiomAudit
          lake env lean BANANA/NonPrecompact/PrebananaFiveAryAbstractExtensionFromPartitionsAxiomAudit.lean

      - name: Audit every finite marked Boolean model embeds in a five-ary stage
