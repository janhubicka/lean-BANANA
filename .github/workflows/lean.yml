          lake env lean BANANA/NonPrecompact/PrebananaFiveAryFiniteExtensionSquareAxiomAudit.lean

      - name: Audit canonical marked atom powerset embedding of abstract finite Boolean models
        run: |
          lake build BANANA.NonPrecompact.PrebananaAbstractModelPowersetEmbeddingAxiomAudit
          lake env lean BANANA/NonPrecompact/PrebananaAbstractModelPowersetEmbeddingAxiomAudit.lean

      - name: Audit marked finite powerset embeddings of five-ary stages
