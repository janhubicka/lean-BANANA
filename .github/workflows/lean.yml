          lake build BANANA.NonPrecompact.PrebananaFiveAryCylinderTupleProfileCompletenessAxiomAudit
          lake env lean BANANA/NonPrecompact/PrebananaFiveAryCylinderTupleProfileCompletenessAxiomAudit.lean

      - name: Audit true finite marked generated-subalgebra profile embedding
