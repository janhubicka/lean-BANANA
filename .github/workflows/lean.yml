      - name: Audit marked allocation on actual five-ary word levels
        run: |
          lake build BANANA.NonPrecompact.PrebananaFiveAryWordLevelAllocationAxiomAudit
          lake env lean BANANA/NonPrecompact/PrebananaFiveAryWordLevelAllocationAxiomAudit.lean

      - name: Regress uniform five-ary finite extensions
        run: python3 scripts/check_prebanana_fiveary_extension_small.py

      - name: Audit prebanana five ary concatenation
        run: |
          lake build BANANA.NonPrecompact.PrebananaFiveAryConcatenationAxiomAudit
          lake env lean BANANA/NonPrecompact/PrebananaFiveAryConcatenationAxiomAudit.lean

      - name: Audit five-ary prefix and fibre marking
