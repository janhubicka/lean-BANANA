          lake build BANANA.NonPrecompact.PrebananaCountableMarkedBooleanModelAxiomAudit
          lake env lean BANANA/NonPrecompact/PrebananaCountableMarkedBooleanModelAxiomAudit.lean

      - name: Audit countable marked Boolean cylinder algebra
