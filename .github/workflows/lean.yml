          lake build BANANA.NonPrecompact.PrebananaFinitePowersetAtomsAxiomAudit
          lake env lean BANANA/NonPrecompact/PrebananaFinitePowersetAtomsAxiomAudit.lean

      - name: Audit unconditional countable pre-BANANA finite extension property
        run: |
          lake build BANANA.NonPrecompact.PrebananaFiveAryCylinderExtensionPropertyAxiomAudit
          lake env lean BANANA/NonPrecompact/PrebananaFiveAryCylinderExtensionPropertyAxiomAudit.lean

      - name: Audit cylinder extension from a finite-stage base factor
        run: |
          lake build BANANA.NonPrecompact.PrebananaFiveAryCylinderExtensionFromStageAxiomAudit
          lake env lean BANANA/NonPrecompact/PrebananaFiveAryCylinderExtensionFromStageAxiomAudit.lean

      - name: Audit global marked Boolean automorphism from finite bridges
        run: |
          lake build BANANA.NonPrecompact.PrebananaFiniteBridgeGlobalAutomorphismAxiomAudit
          lake env lean BANANA/NonPrecompact/PrebananaFiniteBridgeGlobalAutomorphismAxiomAudit.lean

      - name: Audit explicit countable pre-BANANA marked ultrahomogeneity
        run: |
          lake build BANANA.NonPrecompact.PrebananaFiveAryCylinderUltrahomogeneityAxiomAudit
          lake env lean BANANA/NonPrecompact/PrebananaFiveAryCylinderUltrahomogeneityAxiomAudit.lean

      - name: Audit global marked bijection from two-sided bridge chains
        run: |
          lake build BANANA.NonPrecompact.PrebananaFiniteBridgeLimitBijectionAxiomAudit
          lake env lean BANANA/NonPrecompact/PrebananaFiniteBridgeLimitBijectionAxiomAudit.lean

      - name: Audit finite marked bridge preorder and two-sided cofinal chains
        run: |
          lake build BANANA.NonPrecompact.PrebananaFiniteBridgeCofinalAxiomAudit
          lake env lean BANANA/NonPrecompact/PrebananaFiniteBridgeCofinalAxiomAudit.lean

      - name: Audit generic one-point marked Boolean extension
        run: |
          lake build BANANA.NonPrecompact.PrebananaCountableOnePointExtensionAxiomAudit
          lake env lean BANANA/NonPrecompact/PrebananaCountableOnePointExtensionAxiomAudit.lean

      - name: Audit packaged countable pre-BANANA marked Boolean model
