name: Lean

# Feature branches are checked by their PR, not by duplicate push runs.
# Every green run of this workflow uses the same strict verification path.
on:
  push:
    branches: [main]
    tags: ['*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Check exact source revision
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Restore Lean toolchain
        id: toolchain-cache
        uses: actions/cache/restore@v5
        with:
          path: ~/.elan/toolchains
          key: lean-toolchain-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain') }}

      # Cache dependencies only, never the root project's .olean files.
      # No broad restore-key across different manifests.
      - name: Restore pinned dependency workspace
        id: dependency-cache
        uses: actions/cache/restore@v5
        with:
          path: .lake/packages
          key: lake-dependencies-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lakefile.toml', 'lake-manifest.json') }}

      - name: Install elan
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Download Mathlib cache using committed pins
        run: |
          lake exe cache get
          git diff --exit-code HEAD -- lean-toolchain lakefile.toml lake-manifest.json

      - name: Strict release-grade verification
        run: bash scripts/verify_release_candidate.sh

      - name: Archive exact-head verification evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: banana-release-audit-${{ env.EXPECTED_SHA }}
          path: .lake/banana-release-audit/
          include-hidden-files: true
          if-no-files-found: error

      - name: Save trusted main toolchain
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.toolchain-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v5
        continue-on-error: true
        with:
          path: ~/.elan/toolchains
          key: ${{ steps.toolchain-cache.outputs.cache-primary-key }}

      - name: Save trusted main dependency workspace
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.dependency-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v5
        continue-on-error: true
        with:
          path: .lake/packages
          key: ${{ steps.dependency-cache.outputs.cache-primary-key }}
