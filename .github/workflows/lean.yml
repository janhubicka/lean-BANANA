name: Read public Wiki templates
on:
  push:
    branches: [publish-formalisation-wiki-20261126]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read the two public Wiki repositories
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          export GIT_TERMINAL_PROMPT=0
          for project in lean-milliken lean-BANANA; do
            path="$RUNNER_TEMP/$project-wiki"
            url="https://github.com/janhubicka/$project.wiki.git"
            if ! git clone --depth=1 "$url" "$path"; then
              if [ "$project" = lean-BANANA ]; then
                auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
                echo "::add-mask::$auth"
                git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" clone --depth=1 "$url" "$path" || { echo "Cannot clone $project wiki"; continue; }
              else
                echo "Cannot clone $project wiki"
                continue
              fi
            fi
            echo "WIKI-BEGIN $project"
            git -C "$path" rev-parse HEAD
            find "$path" -maxdepth 2 -type f -name '*.md' -printf '%P\n' | sort
            if [ -f "$path/Home.md" ]; then
              echo "HOME-BEGIN $project"
              cat "$path/Home.md"
              echo "HOME-END $project"
            fi
            echo "WIKI-END $project"
          done
