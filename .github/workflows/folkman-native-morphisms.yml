name: Folkman native pairing morphism verification

on:
  push:
    branches:
      - formalize/folkman-native-pairing-morphisms-20261108
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lean:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Record exact source
        run: |
          mkdir -p verification-logs
          git rev-parse HEAD | tee verification-logs/sha.txt
          cat lean-toolchain | tee verification-logs/toolchain.txt
      - name: Install pinned toolchain
        run: |
          set -euo pipefail
          curl -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          "$HOME/.elan/bin/elan" toolchain install "$(tr -d '\r\n' < lean-toolchain)"
      - name: Resolve pinned dependencies
        run: |
          set -euo pipefail
          lake update 2>&1 | tee verification-logs/deps.log
          lake exe cache get 2>&1 | tee verification-logs/mathlib-cache.log
      - name: Build independent native morphism API
        run: |
          set -euo pipefail
          lake build BANANA.NonPrecompact.FolkmanNativePairingEmbedding 2>&1 | tee verification-logs/build.log
      - name: Audit transitive axioms
        run: |
          set -euo pipefail
          lake env lean BANANA/NonPrecompact/FolkmanNativePairingEmbeddingAxiomAudit.lean 2>&1 | tee verification-logs/axioms.log
          python3 - <<'PY'
          import pathlib, re, sys
          text = pathlib.Path("verification-logs/axioms.log").read_text()
          allowed = {"propext", "Classical.choice", "Quot.sound"}
          groups = re.findall(r"depends on axioms:\s*\[([^\]]*)\]", text, re.S)
          if len(groups) + text.count("does not depend on any axioms") < 2:
              sys.exit("Missing audit reports")
          unexpected = {a.strip() for group in groups for a in group.split(",") if a.strip()} - allowed
          if unexpected or "sorryAx" in text:
              sys.exit(f"Unexpected transitive axioms: {sorted(unexpected)}")
          print("Native pairing morphism axiom check passed")
          PY
      - name: Preserve exact-head evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: folkman-native-morphisms-${{ github.sha }}
          path: verification-logs/
          if-no-files-found: error
          retention-days: 14
