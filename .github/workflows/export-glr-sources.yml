name: Export pinned GLR dependency sources
on:
  push:
    branches: [arxiv-v1-verified-glr]
    paths: ['.github/workflows/export-glr-sources.yml']
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          repository: janhubicka/lean-successors
          ref: d9be105f73ca5a0f3f411b87d4c2419d0eb94753
          path: successors
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: janhubicka/lean-ramsey-space-todorcevic
          ref: 54a9eb02f7f7bd2e942e95f7b44fc6f04f48892c
          path: ramsey-space
          persist-credentials: false
      - name: Export exact pinned source snapshots
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/glr-source-snapshots"
          mkdir -p "$out"
          test "$(git -C successors rev-parse HEAD)" = "d9be105f73ca5a0f3f411b87d4c2419d0eb94753"
          test "$(git -C ramsey-space rev-parse HEAD)" = "54a9eb02f7f7bd2e942e95f7b44fc6f04f48892c"
          for repo in successors ramsey-space; do
            git -C "$repo" archive --format=tar --prefix="$repo/" HEAD | gzip -n > "$out/$repo.tar.gz"
            git -C "$repo" ls-tree -r HEAD > "$out/$repo-tree.txt"
            git -C "$repo" rev-parse HEAD HEAD^{tree} > "$out/$repo-revision.txt"
          done
          (cd "$out" && sha256sum *.tar.gz *-tree.txt *-revision.txt > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: glr-source-snapshots
          path: ${{ runner.temp }}/glr-source-snapshots/
          if-no-files-found: error
